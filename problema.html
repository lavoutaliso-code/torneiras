<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operação Fim de Ano — 5 gargalos</title><link rel="stylesheet" href="pele.css">
<script src="chamadas.js"></script>
<style>
.tela{padding:0;gap:0;position:relative}
.texto{position:absolute;left:0;right:0;top:clamp(14px,2.4vh,30px);z-index:4;text-align:center;
  pointer-events:none}
h1{font-family:var(--sfd);font-size:min(clamp(30px,6.4vh,74px),5.8vw);line-height:.96;
  letter-spacing:.012em;text-transform:uppercase;color:var(--tinta);font-weight:700;white-space:nowrap}
.sub{font-size:min(clamp(16px,3vh,32px),2.1vw);line-height:1.16;letter-spacing:-.028em;
  color:var(--t2);margin-top:clamp(4px,.9vh,12px);font-weight:400}
.sub b{color:var(--tinta);font-weight:600;display:block;white-space:nowrap}
#palco{position:absolute;inset:0;z-index:1}
#svg{width:100%;height:100%;display:block}
.lin{stroke:var(--traco);fill:#FFF;stroke-linejoin:round;stroke-linecap:round}
.ql{stroke:var(--laranja);fill:#FFF;stroke-linejoin:round;stroke-linecap:round}
#volante{cursor:pointer;transition:transform .7s cubic-bezier(.22,1,.3,1)}
#alvo{cursor:pointer}
</style></head>
<body><div class="tela">
  <div class="texto">
    <h1>Operação Fim de Ano</h1>
    <p class="sub"><b>Nem todo salão vai ganhar dinheiro</b>neste fim de ano.</p>
  </div>
  <div id="palco"><svg id="svg"></svg></div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
const OURO='#F2B01E', OURO2='#D98A05', TRACO='#6F757B', LARANJA='#FA6503';
const NOMES=['Preço','Agenda','Cliente','Entrada','Sobra'];
const ESCAPA=0.34;                 // quanto cada gargalo rouba do que passa
const svg=document.getElementById('svg');
let G={}, abertos=0, moedas=[], pendente=0, cont=0, pilhas=[0,0,0,0,0], cofre=0, girando=0, t0=0, continuo=false;

const el=(t,a,pai)=>{const e=document.createElementNS(NS,t);
  for(const k in a) e.setAttribute(k,a[k]); (pai||svg).appendChild(e); return e;};

/* ---------- geometria: a torneira INTEIRA à vista, chamadas acima dela ---------- */
function medir(){
  const W=svg.clientWidth, H=svg.clientHeight;
  // a peça é a J3, em escala: o braço dela tem 160 de altura no desenho original
  const T  = Math.max(58, Math.min(H*0.108, 100));   // altura do braço na tela
  const s  = T/160;                                   // escala da J3
  const e  = Math.max(10, Math.min(T*0.16, 16));
  const PY = H*0.415;                                 // SUBIU: mais ar até o boneco
  const topo = PY - T/2, base = PY + T/2;
  const dy   = topo - 158*s;                          // y=158 é o topo do braço na J3
  const dxL  = Math.max(26, W*0.03) - 28*s;           // começo da peça, à vista
  const larguraDir = (1056-780)*s;
  const dxR  = W - Math.max(26, W*0.03) - larguraDir - 780*s;
  const xA   = dxL + 300*s, xB = dxR + 780*s;         // o trecho reto que estica
  const chao = H*0.965;
  const furos=[]; const x1=xA+T*1.5, x2=xB-T*1.0;
  for(let i=0;i<5;i++) furos.push(x1+(x2-x1)*i/4);
  return {W,H,T,s,e,PY,topo,base,dy,dxL,dxR,xA,xB,chao,furos,
          bocaX: dxR + 930*s, bocaY: dy + 492*s};
}

/* ---------- desenho ---------- */
function desenhar(){
  svg.innerHTML=''; G=medir();
  svg.setAttribute('viewBox',`0 0 ${G.W} ${G.H}`);
  const {W,H,T,s:k,e,topo,base,dy,dxL,dxR,xA,xB,chao}=G;

  el('line',{x1:0,y1:chao+8,x2:W,y2:chao+8,stroke:'#CFD3D9','stroke-width':3});

  // 1) o trecho reto (só miolo branco: as bordas vêm depois, inteiras)
  el('rect',{x:xA,y:topo,width:xB-xA,height:base-topo,fill:'#FFF'});

  // 2) módulo da ESQUERDA — idêntico à J3 aprovada
  const gE=el('g',{transform:`translate(${dxL} ${dy}) scale(${k})`});
  const esp=e/k;
  el('ellipse',{cx:86,cy:252,rx:58,ry:120,class:'lin','stroke-width':esp},gE);
  el('path',{d:'M86 158 H300 V346 H86 Z',class:'lin','stroke-width':esp},gE);
  el('path',{d:'M214 70 H290 V166 H214 Z',class:'lin','stroke-width':esp},gE);
  el('rect',{x:230,y:26,width:44,height:66,rx:20,class:'ql','stroke-width':esp},gE);
  const gv=el('g',{id:'volante'},gE);
  gv.style.transformOrigin='252px 22px';
  el('ellipse',{cx:164,cy:22,rx:72,ry:38,class:'ql','stroke-width':esp},gv);
  el('ellipse',{cx:340,cy:22,rx:72,ry:38,class:'ql','stroke-width':esp},gv);
  el('circle',{cx:252,cy:20,r:30,class:'ql','stroke-width':esp},gE);

  // 3) módulo da DIREITA — cotovelo e bica em sino da J3 (sem a emenda vertical)
  const gD=el('g',{transform:`translate(${dxR} ${dy}) scale(${k})`});
  el('path',{d:`M780 158 H880 A180 180 0 0 1 1060 338 V392
                A28 28 0 0 1 1032 420 H828 A28 28 0 0 1 800 392 V338
                A20 20 0 0 0 780 318`,class:'lin','stroke-width':esp},gD);
  el('path',{d:'M836 414 H1024 L1056 470 A20 20 0 0 1 1036 492 H824 A20 20 0 0 1 804 470 Z',
             class:'lin','stroke-width':esp},gD);

  // 4) as duas bordas do trecho reto, por cima, sem emenda
  el('line',{x1:xA,y1:topo,x2:xB,y2:topo,stroke:TRACO,'stroke-width':e,'stroke-linecap':'butt'});
  el('line',{x1:xA,y1:base,x2:xB,y2:base,stroke:TRACO,'stroke-width':e,'stroke-linecap':'butt'});

  // toque no registro
  el('rect',{id:'alvo',x:dxL+(164-80)*k,y:dy-30*k,width:(340-164+160)*k,height:150*k,
             fill:'transparent'}).addEventListener('click',abrir);
  gv.addEventListener('click',abrir);

  el('g',{id:'chamadas'}); el('g',{id:'furos'});
  const cp=el('clipPath',{id:'dentroDoCano'},svg);
  el('rect',{x:xA,y:topo,width:(G.bocaX-xA),height:(G.base-topo)},cp);
  el('g',{id:'ondas','clip-path':'url(#dentroDoCano)'});
  el('g',{id:'pilhas'});   el('g',{id:'moedas'});

  const alt=(chao-G.bocaY)*0.60;          // menor, e longe da boca
  boneco(G.bocaX, chao-alt, alt);
  el('ellipse',{cx:G.bocaX,cy:chao+4,rx:T*1.5,ry:T*0.2,fill:TRACO,opacity:.12});

  for(let i=0;i<abertos;i++) poeFuro(i,false);
  pilhas.forEach((n,i)=>poePilha(i,n));
}

/* ---------- gargalo: furo no cano + chamada ACIMA, seta apontando pra cima ---------- */
function poeFuro(i, anima){
  const x=G.furos[i], y=G.base, T=G.T;
  el('ellipse',{cx:x,cy:y,rx:T*0.30,ry:T*0.115,fill:'var(--fundo)',stroke:TRACO,
    'stroke-width':G.e,'stroke-linejoin':'round'},document.getElementById('furos'));
  window.chamada(document.getElementById('chamadas'), G, i, {anima:anima});
}

function redesenhaPilhas(){
  document.getElementById('pilhas').innerHTML='';
  pilhas.forEach((n,i)=>poePilha(i,n));
}

function poeCofre(){
  const g=document.getElementById('pilhas');
  if(!g || !cofre) return;
  const x=G.bocaX, y=G.chao, r=G.T*0.115;
  const camadas=[4,3,2]; let k=0;            // aqui acumula POUCO
  for(let nv=0; nv<camadas.length && k<cofre; nv++){
    const q=camadas[nv];
    for(let c=0;c<q && k<cofre;c++,k++)
      el('ellipse',{cx:x+(c-(q-1)/2)*r*1.08,cy:y-nv*r*0.7,rx:r,ry:r*0.6,
        fill:OURO,stroke:OURO2,'stroke-width':2.4},g);
  }
}

function poePilha(i,n){
  const g=document.getElementById('pilhas'), x=G.furos[i], y=G.chao, r=G.T*0.17;
  const camadas=[6,5,4,3,2]; let k=0;
  for(let nv=0; nv<camadas.length && k<n; nv++){
    const q=camadas[nv];
    for(let c=0;c<q && k<n;c++,k++)
      el('ellipse',{cx:x+(c-(q-1)/2)*r*1.08,cy:y-nv*r*0.7,rx:r,ry:r*0.6,
        fill:OURO,stroke:OURO2,'stroke-width':2.4},g);
  }
}

/* ---------- boneco ---------- */
function boneco(x, topoY, alt){
  const k=alt/520, rC=58*k, cy=topoY+rC, E=12*k;
  const pescoco=cy+rC+2*k, ombro=pescoco+34*k, quadril=ombro+170*k,
        joelho=quadril+92*k, pe=joelho+96*k;
  G.cabeca={x,y:cy,r:rC};
  const tubos=[[x,pescoco-6*k,x,ombro,20*k],[x,ombro,x,quadril,34*k],
    [x-6*k,ombro+10*k,x-112*k,ombro+158*k,26*k],
    [x+6*k,ombro+10*k,x+112*k,ombro+158*k,26*k],
    [x-4*k,quadril-8*k,x-48*k,joelho,30*k],[x-48*k,joelho,x-44*k,pe,30*k],
    [x+4*k,quadril-8*k,x+48*k,joelho,30*k],[x+48*k,joelho,x+44*k,pe,30*k]];
  const bn=el('g',{id:'bn'});
  const risco=(cor,mais)=>tubos.forEach(([a,b,c,d,gr])=>
    el('path',{d:`M${a} ${b} L${c} ${d}`,fill:'none',stroke:cor,
      'stroke-width':gr+mais,'stroke-linecap':'round'},bn));
  const a1=-116*Math.PI/180,a2=-64*Math.PI/180;
  const cab=`M${x} ${cy} L${x+rC*Math.cos(a1)} ${cy+rC*Math.sin(a1)}
    A ${rC} ${rC} 0 1 0 ${x+rC*Math.cos(a2)} ${cy+rC*Math.sin(a2)} Z`;
  risco(TRACO,2*E);
  el('path',{d:cab,fill:TRACO,stroke:TRACO,'stroke-width':2*E,'stroke-linejoin':'round'},bn);
  risco('#FFF',0);
  el('path',{d:cab,fill:'#FFF',stroke:'#FFF','stroke-width':1,'stroke-linejoin':'round'},bn);
  const cw=168*k, ch=116*k, cx0=x-cw/2, cy0=ombro+16*k;
  el('rect',{x:cx0,y:cy0,width:cw,height:ch,rx:26*k,fill:'#FFF',stroke:TRACO,'stroke-width':E},bn);
  [['LUCRO',48],['LÍQUIDO',90]].forEach(([txt,dy])=>{
    const t=el('text',{x:x,y:cy0+dy*k,'text-anchor':'middle','font-size':31*k,'font-weight':700,
      fill:'#17150F','font-family':"-apple-system,'SF Pro Text',sans-serif"},bn);
    t.textContent=txt;});
}

/* ---------- o fluxo é CONTÍNUO: abriu, não para mais; abriu de novo, aumenta ---------- */
// cada aperto manda uma LEVA — e ela é maior que a anterior
/* ---------- fila de moedas: vêm uma ao lado da outra, um bloco delas faz o
   L e cai junto em cada gargalo, e o resto segue junto. ---------- */
function moedaEl(){
  const g=el('g',{},document.getElementById('ondas'));
  el('ellipse',{rx:G.T*0.105,ry:G.T*0.072,fill:OURO,stroke:OURO2,'stroke-width':2.4},g);
  return g;
}
function emitirLeva(){ pendente++; }       // entra na fila: só sai quando a anterior acabar
function soltarLeva(){
  const passam = Math.max(1, 4-abertos);        // no máximo 3 chegam no lucro
  const n = 34 + abertos*12;                    // vem MUITA moeda
  const passo = G.T*0.46;                       // uma ao lado da outra
  const porFuro = abertos ? Math.ceil((n-passam)/abertos) : 0;
  for(let i=0;i<n;i++){
    const bloco = porFuro ? Math.floor(i/porFuro) : 99;
    const furo  = (abertos && bloco < abertos && i < n-passam) ? bloco : null;
    moedas.push({el:moedaEl(), x:G.xA - G.T*0.6 - i*passo, y:G.PY,
                 vy:0, estado:'cano', furo, qtd:1, rot:Math.random()*360});
  }
}
function passo(ts){
  // a leva nova só começa quando a anterior caiu inteira — assim fica alinhado
  if(moedas.length===0){
    if(pendente>0){ pendente--; soltarLeva(); }
    else if(continuo) soltarLeva();
  }
  const v=G.W*0.0062;
  moedas=moedas.filter(m=>{
    if(m.estado==='cano'){
      m.x+=v;
      if(m.furo!==null && m.x>=G.furos[m.furo]){        // o L: vira e desce
        m.estado='cai'; m.x=G.furos[m.furo]; m.y=G.base; m.vy=G.H*0.008;
        m.el.parentNode.removeChild(m.el);
        document.getElementById('moedas').appendChild(m.el);
      } else if(m.x>=G.bocaX){
        m.estado='cai'; m.x=G.bocaX; m.y=G.bocaY; m.vy=G.H*0.008;
        m.el.parentNode.removeChild(m.el);
        document.getElementById('moedas').appendChild(m.el);
      }
    } else {
      m.vy+=G.H*0.0019; m.y+=m.vy;
      if(m.y>=G.chao-G.T*0.1){
        if(m.furo!==null){ pilhas[m.furo]=Math.min(pilhas[m.furo]+1,22); redesenhaPilhas(); } m.el.remove(); return false;
      }
    }
    m.rot+=5;
    m.el.setAttribute('transform',`translate(${m.x} ${m.y})`+
      (m.estado==='cano'?` rotate(${m.rot*0.18})`:''));
    return true;
  });
  requestAnimationFrame(passo);
}

function giraVolante(){
  const v=document.getElementById('volante');
  if(v) v.animate([{transform:'rotate(0deg)'},{transform:'rotate(80deg)'}],
    {duration:620,easing:'cubic-bezier(.3,0,.2,1)'});
}

function abrir(){
  if(abertos>=5){                       // 6º toque: abre de vez, fluxo contínuo
    if(!continuo){ continuo=true;
  giraVolante(); }
    return;
  }
  giraVolante();
  poeFuro(abertos,true); abertos++;
  emitirLeva();
  if(abertos===5) continuo=true;        // no 5º, o fluxo não para mais
}
addEventListener('resize',()=>desenhar());
desenhar(); requestAnimationFrame(passo);
</script>
</body></html>
